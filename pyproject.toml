[project]
name = "owl-akrida"
version = "1.0.0"
description = "Load testing tool for Aries agents"
requires-python = ">=3.10"
dependencies = [
    "locust==2.42.2",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Monkey-patching ssl:",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
